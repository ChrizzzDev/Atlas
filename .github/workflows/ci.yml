name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install V
        uses: vlang/setup-v@v1.7
        with:
          stable: true
          clean: true

      - name: Check formatting
        run: v fmt --verify .

      - name: Run vet
        run: v vet .

      - name: Build
        run: v .