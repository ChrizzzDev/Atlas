name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Pin the official release binaries: building old stable sources with
      # today's vc bootstrap can fail before Atlas is compiled.
      - name: Install V 0.5.2
        shell: bash
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) archive=v_linux.zip ;;
            Linux/ARM64) archive=v_linux_arm64.zip ;;
            macOS/ARM64) archive=v_macos_arm64.zip ;;
            macOS/X64) archive=v_macos_x86_64.zip ;;
            Windows/X64) archive=v_windows.zip ;;
            *) exit 1 ;;
          esac
          install_dir="$RUNNER_TEMP/atlas-v"
          mkdir -p "$install_dir"
          curl -fsSL "https://github.com/vlang/v/releases/download/0.5.2/$archive" -o "$install_dir/v.zip"
          unzip -q "$install_dir/v.zip" -d "$install_dir"
          echo "$install_dir/v" >> "$GITHUB_PATH"

      - name: Test
        run: v test .

      - name: Build
        run: v .


      - name: Check dependency formatting
        run: v fmt -diff deps.v deps_test.v main.v
