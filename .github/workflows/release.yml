name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            artifact: atlas-linux-x86_64

          - name: windows-x86_64
            os: windows-latest
            artifact: atlas-windows-x86_64.exe

          - name: macos-x86_64
            os: macos-13
            artifact: atlas-macos-x86_64

          - name: macos-aarch64
            os: macos-14
            artifact: atlas-macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install V
        uses: vlang/setup-v@v1.7
        with:
          stable: true

      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          v -autofree -prod -o "dist/${{ matrix.artifact }}" .

      - name: Verify binary
        shell: bash
        run: |
          if [ ! -f "dist/${{ matrix.artifact }}" ]; then
            echo "Binary was not created."
            exit 1
          fi

          ls -lh "dist/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -lh dist

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/atlas-linux-x86_64
            dist/atlas-windows-x86_64.exe
            dist/atlas-macos-x86_64
            dist/atlas-macos-aarch64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}